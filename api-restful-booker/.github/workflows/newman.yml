name: Restful Booker API Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  newman-tests:
    name: Run Newman API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Create Report Directories
        run: |
          mkdir -p reports/HTML
          mkdir -p reports/JSON
          mkdir -p reports/JUnit

      - name: Run Restful Booker API Collection
        run: |
          newman run 05_Postman/RestfulBooker.postman_collection.json \
            -r cli,json,junit,htmlextra \
            --reporter-json-export reports/JSON/newman-report.json \
            --reporter-junit-export reports/JUnit/newman-report.xml \
            --reporter-htmlextra-export reports/HTML/newman-report.html

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: Newman-HTML-Report
          path: reports/HTML/

      - name: Upload JSON Report
        uses: actions/upload-artifact@v4
        with:
          name: Newman-JSON-Report
          path: reports/JSON/

      - name: Upload JUnit Report
        uses: actions/upload-artifact@v4
        with:
          name: Newman-JUnit-Report
          path: reports/JUnit/